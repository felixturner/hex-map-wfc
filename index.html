<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hex Map Toy</title>
    <link rel="icon" href="./favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap" rel="stylesheet">
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: #000;
        overflow: hidden;
      }
      #canvas {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        /* Disable long-press context menu and haptic feedback on mobile */
        -webkit-touch-callout: none;
        -webkit-user-select: none;
        user-select: none;
        touch-action: manipulation;
      }
      #loading {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #000;
        z-index: 1000;
      }
      #loading img {
        width: 48px;
        height: 48px;
        margin-bottom: 24px;
      }
      .lil-gui.gui-hidden { display: none; }
      #map-library {
        position: fixed;
        right: 12px;
        top: 12px;
        z-index: 999;
        width: 330px;
        max-width: calc(100vw - 24px);
        border: 1px solid #64786c;
        border-radius: 12px;
        background: rgba(20, 30, 25, 0.96);
        box-shadow: 0 12px 36px #0005;
        color: #eef3ef;
        font: 12px/1.45 'Inter', sans-serif;
      }
      #map-library summary { cursor: pointer; padding: 10px 0; font-weight: 500; }
      #map-library > summary { padding: 14px; font-size: 16px; }
      #map-library > summary span { display: block; margin: 3px 0 0 16px; color: #b5c6ba; font-size: 11px; }
      .workshop-body { padding: 0 14px 14px; max-height: calc(100dvh - 150px); overflow-y: auto; overscroll-behavior: contain; }
      .workshop-intro { margin: 0 0 10px; color: #c6d4cb; }
      .recipe-controls > details { border-top: 1px solid #ffffff20; }
      #map-library label { display: block; margin: 9px 0; }
      #map-library .slider-control { display: grid; grid-template-columns: 1fr auto; gap: 5px; }
      .slider-control input { grid-column: 1 / -1; width: 100%; margin: 0; accent-color: #b7d99d; }
      .slider-control output { color: #c9e4b4; font-variant-numeric: tabular-nums; }
      .workshop-row { display: flex; flex-wrap: wrap; gap: 6px; margin: 9px 0; }
      #map-library button, #map-library select, #map-library input:not([type=range]):not([type=checkbox]) {
        padding: 8px; min-height: 34px; min-width: 0;
        background: #293c32; border: 1px solid #687f70; border-radius: 5px; color: #fff; font: inherit;
      }
      #map-library label > input:not([type=range]):not([type=checkbox]), #map-library select { width: 100%; margin-top: 4px; }
      #map-library button { cursor: pointer; }
      #map-library button:hover { background: #3e5547; }
      #map-library button.primary { width: 100%; background: #bdd99d; color: #172517; border-color: #bdd99d; font-weight: 500; }
      #map-library :disabled { opacity: 0.45; cursor: default; }
      #map-library :focus-visible { outline: 2px solid #d8f2bd; outline-offset: 2px; }
      .workshop-hint, .pending-settings { color: #b5c6ba; font-size: 11px; }
      .save-section { border-top: 1px solid #ffffff25; padding-top: 6px; }
      #map-library [role=status] { margin-top: 10px; color: #d5e8c5; }
      @media (max-width: 600px) {
        #map-library { top: 76px; right: 8px; width: 300px; }
        .workshop-body { max-height: calc(100dvh - 230px); }
      }
      @media (orientation: portrait) {
        #ui-menu { flex-direction: column !important; }
      }
      #title-overlay {
        position: fixed;
        top: 10px;
        left: 10px;
        z-index: 1000;
        font-family: 'Inter', sans-serif;
        font-size: 14px;
        color: rgba(255,255,255,0.8);
        text-shadow: 0 1px 3px rgba(0,0,0,0.48);
      }
      #title-overlay .title-row {
        display: flex;
        align-items: baseline;
        gap: 10px;
      }
      #title-overlay .title {
        font-weight: 500;
      }
      #title-overlay a {
        color: rgba(255,255,255,0.8);
        text-decoration: underline;
      }
      #status-text {
        margin-top: 8px;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="title-overlay">
      <div class="title-row">
        <div class="title">Hex Map Toy</div>
        <a href="https://felixturner.github.io/hex-map-wfc/article/" target="_blank">Read Article</a>
        <a href="https://github.com/felixturner/hex-map-wfc" target="_blank">Source</a>
      </div>
      <div id="status-text"></div>
    </div>
    <div id="loading">
      <img src="assets/loader.gif" alt="Loading" id="loader-gif" />
    </div>
    <canvas id="canvas"></canvas>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
